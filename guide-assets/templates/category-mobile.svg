<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-label="Category image, mobile, 1000 by 1000 pixels"><title>Aurick image preparation guide — Category image</title><desc>Composition guide only. Dashed lines do not guarantee the crop on every device. Recommended export dimensions, not a platform requirement.</desc><defs><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M 50 0 H0 V50" fill="none" stroke="#c8d3ba" stroke-width="1"/></pattern></defs><rect width="1000" height="1000" fill="#eef2e5"/><rect width="1000" height="1000" fill="url(#grid)"/><rect x="120" y="120" width="760" height="760" fill="none" stroke="#97aa80" stroke-width="2" stroke-dasharray="12 10"/><path d="M500 0V1000M0 500H1000" stroke="#a7b697" stroke-dasharray="6 12"/><rect x="140" y="340" width="720" height="320" rx="15" fill="#f8faef"/><g text-anchor="middle" fill="#28472c" font-family="Arial,sans-serif"><text x="500" y="435" font-size="23.099999999999998" letter-spacing="3">AURICK / IMAGE GUIDE</text><text x="500" y="515" font-size="55">1000 × 1000</text><text x="500" y="575" font-size="19.8">CATEGORY IMAGE · MOBILE</text><text x="500" y="620" font-size="15.95" fill="#637c54">COMPOSITION GUIDE — REPLACE BEFORE PUBLISHING</text></g></svg>